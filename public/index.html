<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Noticias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="site-body">
  <div class="ticker-wrap">
    <div class="ticker-title">Plantao</div>
    <div class="ticker" id="ticker-noticias"></div>
  </div>

  <nav class="navbar navbar-expand-lg glass-nav sticky-top">
    <div class="container">
      <a class="navbar-brand brand-lockup" href="index.html" id="brand-link">Portal Noticias</a>
      <div class="ms-auto d-flex gap-2">
        <a href="admin.html" class="btn btn-outline-light btn-sm">Admin</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <section class="home-toolbar mb-4">
      <div>
        <strong>Explore o portal</strong>
        <span>busque por titulo, assunto ou categoria</span>
      </div>
      <form id="form-filtros" class="toolbar-form">
        <input type="search" id="busca" class="form-control" placeholder="Buscar noticias">
        <select id="filtro-categoria" class="form-select">
          <option value="">Todas as categorias</option>
        </select>
        <button type="submit" class="btn btn-accent">Filtrar</button>
      </form>
    </section>

    <section id="carousel-section" class="mb-4"></section>

    <div class="row g-4" id="layout-home">
      <section class="col-lg-8" id="col-noticias">
        <div class="section-heading">
          <span>Ultimas noticias</span>
          <small id="contador-noticias"></small>
        </div>
        <div id="grid-noticias" class="news-list"></div>
        <nav class="mt-4">
          <ul class="pagination justify-content-center" id="paginacao"></ul>
        </nav>
      </section>

      <aside class="col-lg-4" id="sidebar-home">
        <div class="sticky-sidebar">
          <section class="side-panel mb-3">
            <h2>Mais lidas</h2>
            <div id="mais-lidas"></div>
          </section>

          <section class="side-panel mb-3">
            <h2>Agenda de jogos</h2>
            <div id="widget-jogos"></div>
          </section>

          <section class="side-panel mb-3">
            <h2>Enquete</h2>
            <div id="widget-enquete"></div>
          </section>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
